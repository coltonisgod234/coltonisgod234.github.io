// We're using listenbrainz because ACTUALLY FUCK LASTFM SO HARD
async function getNowPlaying() {
  const username = "artemiscodes";
  //const lbURL = `https://api.listenbrainz.org/1/user/${username}/listens?count=1`;
  const lbURL = `https://api.listenbrainz.org/1/user/${username}/playing-now`;

  try {
    const res = await fetch(lbURL);
    if (!res.ok) throw new Error("Network response not OK");

    const data = await res.json();
    console.log(data)
    const listens = data.payload?.listens;

    if (!data.payload.playing_now || listens[0] == undefined) {
      document.getElementById("nowplaying").textContent = "Nothing's playing according to ListenBrainz.";
      return;
    }

    const latest = listens[0];

    const track = latest.track_metadata;
    const artist = track.artist_name || "Unknown artist";
    const title = track.track_name || "Unknown track";
    const album = track.release_name || `${artist}'s singles`;
    // FUCK IMAGES WE DON'T NEED ALBUM ART.

    document.getElementById("nowplaying").innerHTML =
      `\"<big><b>${title}</b></big>\"<br>by <i>${artist}</i><br>from ${album}`;
  } catch (err) {
    console.error("ListenBrainz fetch error:", err);
    document.getElementById("nowplaying").textContent = "Error loading music status.";
  }
}

window.onload = getNowPlaying;
</script>
