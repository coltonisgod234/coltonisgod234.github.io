<!-- SOME FUCKING JAVASCRIPT -->
 <script>
    // excuse my bad JS

    function teto_bmi(
        // general stuff
        total_mass,
        human_height,
        bat_length,
        bread_length, bread_exponent,

        // fractions
        human_part, bat_part, bread_part,
    ) {
        // human BMI
        let human_mass = total_mass * human_part;
        let human_bmi = human_mass / human_height**2;
        
        // Bat BMI
        let bat_mass = total_mass * bat_part
        let bat_bmi = bat_mass / bat_length**2

        // Bread BMI
        let bread_mass = total_mass * bread_part
        let bread_bmi = bread_mass / bread_length**bread_exponent

        // Weighted chimera BMI
        let chimera_bmi = human_bmi + bat_bmi + bread_bmi

        return {
            human: human_bmi,
            bread: bread_bmi,
            bat: bat_bmi,
            total: chimera_bmi
        }
    }

    function run() {
        // general
        let mass = parseFloat(document.getElementById("mass").value);

        // fractions
        let humanFrac = parseFloat(document.getElementById("humanFrac").value);
        let breadFrac = parseFloat(document.getElementById("breadFrac").value);
        let breadExp = parseFloat(document.getElementById("breadExp").value);
        let breadLen = parseFloat(document.getElementById("breadLen").value);
        let batFrac = parseFloat(document.getElementById("batFrac").value);
        let batLen = parseFloat(document.getElementById("batLen").value);

        // stuff
        let height = parseFloat(document.getElementById("height").value);

        // get result
        let result = teto_bmi(mass, height, batLen, breadLen, breadExp, humanFrac, batFrac, breadFrac);
        document.getElementById("humanRes").textContent = result.human;
        document.getElementById("batRes").textContent = result.bat;
        document.getElementById("breadRes").textContent = result.bread;
        document.getElementById("result").textContent = result.total;
    }
</script>
